name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./extension

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        # --force: EBADPLATFORM workaround for @esbuild optional platform packages (see 2f3b351)
        run: npm ci --prefer-offline --no-audit --force

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Verify version sync
        run: node scripts/version-sync.mjs
        working-directory: .

  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./extension
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        # --force: EBADPLATFORM workaround for @esbuild optional platform packages (see 2f3b351)
        run: npm ci --prefer-offline --no-audit --force

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Check version consistency across files
        run: node scripts/version-sync.mjs
